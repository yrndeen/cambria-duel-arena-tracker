[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[[redirects]]
from = "/api/wallet/*"
to = "/.netlify/functions/wallet/:splat"
status = 200

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[dev]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
